name: Build Rings of Power Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out pinned Lemuroid source
        run: |
          git clone --recursive https://github.com/Swordfish90/Lemuroid.git upstream
          cd upstream
          git checkout 53752bf29bc3f95c50f6c38f70cd4a53450a7098
          git submodule update --init --recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: upstream/**/*.gradle*

      - name: Apply Rings of Power branding
        working-directory: upstream
        run: |
          sed -i 's/applicationId = "com.swordfish.lemuroid"/applicationId = "com.jimmeali.ringsofpower"/' lemuroid-app/build.gradle.kts
          sed -i 's/resValue("string", "lemuroid_name", "LemuroiDebug")/resValue("string", "lemuroid_name", "Rings of Power")/' lemuroid-app/build.gradle.kts
          sed -i 's/versionNameSuffix = "-DEBUG"/versionNameSuffix = "-RINGS-ALPHA-4"/' lemuroid-app/build.gradle.kts
          mkdir -p lemuroid-app/src/main/res/drawable
          cat > lemuroid-app/src/main/res/drawable/rings_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#111827" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#F4C542" android:fillType="evenOdd"
                  android:pathData="M54,14A40,40 0,1 0,54 94A40,40 0,1 0,54 14M54,32A22,22 0,1 1,54 76A22,22 0,1 1,54 32"/>
              <path android:fillColor="#FFF2A8" android:pathData="M54,5L68,19L54,31L40,19Z"/>
          </vector>
          EOF
          sed -i 's|android:icon="@mipmap/lemuroid_launcher"|android:icon="@drawable/rings_launcher"|' lemuroid-app/src/main/AndroidManifest.xml
          sed -i 's|android:roundIcon="@mipmap/lemuroid_launcher_round"|android:roundIcon="@drawable/rings_launcher"|' lemuroid-app/src/main/AndroidManifest.xml
          sed -i '/android.permission.RECORD_AUDIO/d' lemuroid-app/src/main/AndroidManifest.xml

      - name: Focus home screen on Rings of Power
        working-directory: upstream
        run: |
          strings='lemuroid-app/src/main/res/values/strings.xml'
          sed -i 's|<string name="title_home">Home</string>|<string name="title_home">Rings of Power</string>|' "$strings"
          sed -i 's|<string name="title_systems">Systems</string>|<string name="title_systems">Genesis</string>|' "$strings"
          sed -i 's|<string name="title_games">Games</string>|<string name="title_games">Adventure</string>|' "$strings"
          sed -i 's|<string name="home_empty_title">Select ROMs directory</string>|<string name="home_empty_title">Select your Rings of Power folder</string>|' "$strings"
          sed -i 's|<string name="home_empty_message">Lemuroid needs to scan a directory containing ROM files.\\nThis might take up to a few minutes.</string>|<string name="home_empty_message">Choose the folder containing your legally obtained Rings of Power Genesis ROM.</string>|' "$strings"
          sed -i 's|<string name="home_empty_action">Select Directory</string>|<string name="home_empty_action">Choose Game Folder</string>|' "$strings"
          sed -i 's/showNoMicrophonePermissionCard = showMicrophoneCard/showNoMicrophonePermissionCard = false/' lemuroid-app/src/main/java/com/swordfish/lemuroid/app/mobile/feature/home/HomeViewModel.kt
          grep -q 'Select your Rings of Power folder' "$strings"
          grep -q 'showNoMicrophonePermissionCard = false' lemuroid-app/src/main/java/com/swordfish/lemuroid/app/mobile/feature/home/HomeViewModel.kt

      - name: Create single-game home experience
        working-directory: upstream
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path("lemuroid-app/src/main/java/com/swordfish/lemuroid/app/mobile/feature/main/MainActivity.kt")
          text = main.read_text()
          old = "bottomBar = { MainNavigationBar(currentRoute, navController) },"
          new = "bottomBar = { },"
          if old not in text:
              raise SystemExit("Main navigation patch target not found")
          main.write_text(text.replace(old, new))

          home = Path("lemuroid-app/src/main/java/com/swordfish/lemuroid/app/mobile/feature/home/HomeScreen.kt")
          text = home.read_text()
          start_marker = '        HomeRow(\n            stringResource(id = R.string.recent),'
          end_marker = '\n    }\n}\n\n@OptIn'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("Home screen anchor not found")
          new = """        val ringsGames =
              (state.recentGames + state.favoritesGames + state.discoveryGames)
                  .distinctBy { it.id }
          HomeRow(
              "Play Rings of Power",
              ringsGames.take(1),
              onGameClicked,
              onGameLongClick,
          )"""
          home.write_text(text[:start] + new + text[end:])
          PY
          grep -q 'Play Rings of Power' lemuroid-app/src/main/java/com/swordfish/lemuroid/app/mobile/feature/home/HomeScreen.kt
          grep -q 'bottomBar = { }' lemuroid-app/src/main/java/com/swordfish/lemuroid/app/mobile/feature/main/MainActivity.kt

      - name: Keep Genesis core only
        working-directory: upstream
        run: |
          find lemuroid-cores/bundled-cores/src/main/jniLibs \
            \( -type f -o -type l \) \
            -name '*_libretro_android.so' \
            ! -name 'libgenesis_plus_gx_libretro_android.so' \
            -delete
          test "$(find lemuroid-cores/bundled-cores/src/main/jniLibs -name 'libgenesis_plus_gx_libretro_android.so' | wc -l)" -ge 1

      - name: Build standalone APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          yes | sdkmanager --licenses >/dev/null || true
          ./gradlew :lemuroid-app:assembleFreeBundleDebug --stacktrace

      - name: Collect named APK
        run: |
          mkdir -p apk-output
          source_apk="$(find upstream/lemuroid-app/build/outputs/apk/freeBundle/debug -type f -name '*.apk' -print -quit)"
          test -n "$source_apk"
          cp "$source_apk" apk-output/Rings-of-Power-Android-alpha-4.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rings-of-Power-Android-alpha-4
          path: apk-output/Rings-of-Power-Android-alpha-4.apk
          if-no-files-found: error
          retention-days: 30
