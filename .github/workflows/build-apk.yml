name: Build Rings of Power Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out pinned Lemuroid source
        run: |
          git clone --recursive https://github.com/Swordfish90/Lemuroid.git upstream
          cd upstream
          git checkout 53752bf29bc3f95c50f6c38f70cd4a53450a7098
          git submodule update --init --recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: upstream/**/*.gradle*

      - name: Apply Rings of Power configuration
        working-directory: upstream
        run: |
          sed -i 's/applicationId = "com.swordfish.lemuroid"/applicationId = "com.jimmeali.ringsofpower"/' lemuroid-app/build.gradle.kts
          sed -i 's/resValue("string", "lemuroid_name", "LemuroiDebug")/resValue("string", "lemuroid_name", "Rings of Power")/' lemuroid-app/build.gradle.kts
          sed -i 's/versionNameSuffix = "-DEBUG"/versionNameSuffix = "-RINGS-ALPHA"/' lemuroid-app/build.gradle.kts
          grep -q 'com.jimmeali.ringsofpower' lemuroid-app/build.gradle.kts
          grep -q 'Rings of Power' lemuroid-app/build.gradle.kts

      - name: Build standalone APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          yes | sdkmanager --licenses >/dev/null || true
          ./gradlew :lemuroid-app:assembleFreeBundleDebug --stacktrace

      - name: Collect named APK
        run: |
          mkdir -p apk-output
          source_apk="$(find upstream/lemuroid-app/build/outputs/apk/freeBundle/debug -type f -name '*.apk' -print -quit)"
          test -n "$source_apk"
          cp "$source_apk" apk-output/Rings-of-Power-Android-alpha.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rings-of-Power-Android-alpha
          path: apk-output/Rings-of-Power-Android-alpha.apk
          if-no-files-found: error
          retention-days: 30
