name: Build compatibility APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out pinned Lemuroid source
        run: |
          git clone --recursive https://github.com/Swordfish90/Lemuroid.git upstream
          cd upstream
          git checkout 53752bf29bc3f95c50f6c38f70cd4a53450a7098
          git submodule update --init --recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: upstream/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APKs
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p apk-output
          find upstream -type f -path '*/build/outputs/apk/*' -name '*.apk' -exec cp {} apk-output/ \;
          test -n "$(find apk-output -type f -name '*.apk' -print -quit)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rings-of-power-compatibility-apks
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30
