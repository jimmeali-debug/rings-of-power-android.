name: Build Rings of Power game APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'native-remaster/**'
      - '.github/workflows/build-native-game.yml'

permissions:
  contents: read

jobs:
  build-game:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android SDK packages
        run: |
          sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit)"
          test -n "$sdkmanager_bin"
          packages=()
          test -f "$ANDROID_HOME/platforms/android-35/android.jar" || packages+=('platforms;android-35')
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2" || packages+=('build-tools;35.0.0')
          if (( ${#packages[@]} )); then
            yes | "$sdkmanager_bin" --licenses >/dev/null || true
            "$sdkmanager_bin" "${packages[@]}"
          fi
      - name: Test game progression
        run: bash native-remaster/test-game-progress.sh
      - name: Build signed game APK
        run: bash native-remaster/build-game-apk.sh apk-output/Rings-of-Power-Game.apk
      - name: Upload game APK
        uses: actions/upload-artifact@v4
        with:
          name: Rings-of-Power-Game
          path: apk-output/Rings-of-Power-Game.apk
          if-no-files-found: error
          retention-days: 30
