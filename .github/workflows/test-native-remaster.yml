name: Test native remaster foundation

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'native-remaster/**'
      - '.github/workflows/test-native-remaster.yml'

permissions:
  contents: read

jobs:
  audio-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and test audio runtime
        run: bash native-remaster/test-audio-runtime.sh
      - name: Test Android storage adapter
        run: bash native-remaster/test-android-storage.sh
      - name: Test ROM scene decoder
        run: bash native-remaster/test-rom-runtime.sh
      - name: Ensure Android API 35
        run: |
          android_jar="$ANDROID_HOME/platforms/android-35/android.jar"
          if [[ ! -f "$android_jar" ]]; then
            sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit)"
            test -n "$sdkmanager_bin"
            yes | "$sdkmanager_bin" --licenses >/dev/null || true
            "$sdkmanager_bin" 'platforms;android-35'
          fi
          test -f "$android_jar"
      - name: Compile Android storage adapter
        run: bash native-remaster/compile-android-storage.sh
